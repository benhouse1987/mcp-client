# MCP Server Configuration
# mcp.server.address=http://localhost:8080/mcp

# Large Language Model Configuration
large.model.url=https://api.openai.com/v1/chat/completions
large.model.name=gpt-4.1
large.model.key=YOUR_OPENAI_API_KEY_HERE

# Server port
server.port=8888

# MySQL DataSource
spring.datasource.url=jdbc:mysql://localhost:3306/mcp_chat_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=your_mysql_username
spring.datasource.password=your_mysql_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis Plus Configuration
mybatis-plus.mapper-locations=classpath:/mapper/**/*.xml
mybatis-plus.global-config.db-config.id-type=auto
